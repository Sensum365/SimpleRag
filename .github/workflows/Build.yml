# This workflow will build a .NET project

name: Build
on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
    - name: Restore dependencies
      run: dotnet restore SimpleRag.sln
    - name: Build
      run: dotnet build --configuration Release --no-restore
    - name: NuGet login
      id: nuget-login
      uses: NuGet/login@v1
      with:
        user: sensum365
    - name: Publish to NuGet if needed
      run: dotnet nuget push "src/bin/Release/*.nupkg" --source https://api.nuget.org/v3/index.json --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --skip-duplicate
